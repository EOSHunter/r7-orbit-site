# The weekly newsletter: when the weekly Mercury routine pushes an issue to its own branch (claude/newsletter-<date>, Sundays),
# **send it** to every Buttondown subscriber, with no one reading it first (Hunter's call, 2026-11-16). Only an issue marked
# `status: ready` after a Parallax pass goes out; if Buttondown refuses the send, it becomes a draft and the run fails.
# docs/NEWSLETTER.md, "Every week". Needs the repository secret BUTTONDOWN_API_KEY (a Buttondown key that may send).
#
# Only pushes to claude/newsletter-* branches run it, only issues added by the push are sent, and the script skips an issue
# whose subject Buttondown already has, so nothing is sent twice. By hand: Actions > Newsletter draft > Run workflow, with a
# file path (sends it, unless Buttondown already has it) and "draft" ticked to make only a draft.
name: Newsletter draft

on:
  push:
    branches:
      - 'claude/newsletter-**'
    paths:
      - 'newsletter/issues/*.md'
  workflow_dispatch:
    inputs:
      file:
        description: 'Issue file, e.g. newsletter/issues/2026-11-15.md'
        required: true
      draft:
        description: 'Only make a draft (do not send)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: newsletter-draft
  cancel-in-progress: false

jobs:
  draft:
    name: Buttondown send
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Find the issues this push added
        id: files
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          INPUT_FILE: ${{ github.event.inputs.file }}
        run: |
          if [ -n "$INPUT_FILE" ]; then
            files="$INPUT_FILE"
          else
            # A new branch has no "before": compare with main instead.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE=$(git merge-base origin/main "$AFTER")
            fi
            files=$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" -- 'newsletter/issues/*.md' | tr '\n' ' ')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Issues: ${files:-none}"
      - name: Send it with Buttondown
        if: steps.files.outputs.files != ''
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DRAFT_ONLY: ${{ github.event.inputs.draft == 'true' && '--draft' || '' }}
        run: node scripts/newsletter-draft.mjs $DRAFT_ONLY ${{ steps.files.outputs.files }}
