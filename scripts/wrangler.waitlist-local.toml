# For trying the waitlist on your computer only (docs/DEPLOY_CLOUDFLARE.md, section 10, "Trying it on your computer"). Wrangler
# needs a config to create the table in the local database that `wrangler pages dev --d1 WAITLIST_DB=r7-orbit-waitlist` uses;
# this is it, passed with `-c`. It is deliberately NOT named wrangler.toml and NOT at the repository root: Cloudflare Pages would
# read a root wrangler.toml as the project's bindings and stop using the ones set in the dashboard.
name = "r7-orbit-site-local"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "WAITLIST_DB"
database_name = "r7-orbit-waitlist"
# Must match the id after "=" in `--d1 WAITLIST_DB=r7-orbit-waitlist`: that is what makes both commands use the same local file.
database_id = "r7-orbit-waitlist"
