<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" role="img" aria-label="Mercury: a small brass planet with a sealed envelope travelling along its orbit">
  <defs>
    <radialGradient id="plate" cx="0.5" cy="0.45" r="0.7"><stop offset="0" stop-color="#17171a"/><stop offset="1" stop-color="#09090a"/></radialGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.75"><stop offset="0" stop-color="#c9a96a" stop-opacity="0.14"/><stop offset="1" stop-color="#c9a96a" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a96a" stop-opacity="0.6"/><stop offset="1" stop-color="#c9a96a" stop-opacity="0.16"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e3c98f" stop-opacity="0.35"/><stop offset="0.5" stop-color="#e3c98f" stop-opacity="0.1"/><stop offset="1" stop-color="#e3c98f" stop-opacity="0"/></radialGradient>
    <radialGradient id="planet" cx="0.36" cy="0.32" r="0.8"><stop offset="0" stop-color="#f1dca8"/><stop offset="0.35" stop-color="#c9a96a"/><stop offset="0.8" stop-color="#7d6438"/><stop offset="1" stop-color="#4a3b21"/></radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e3c98f" stop-opacity="0"/><stop offset="1" stop-color="#f1dca8" stop-opacity="0.85"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf1d6"/><stop offset="1" stop-color="#e3c98f"/></linearGradient>
    <clipPath id="disc"><circle cx="232" cy="276" r="92"/></clipPath>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#plate)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#sheen)"/>
  <g fill="#c9a96a">
    <circle cx="74" cy="118" r="2.6" fill-opacity="0.55"/><circle cx="420" cy="430" r="2" fill-opacity="0.45"/>
    <circle cx="92" cy="420" r="2.2" fill-opacity="0.5"/><circle cx="460" cy="300" r="1.8" fill-opacity="0.4"/>
    <circle cx="150" cy="70" r="1.8" fill-opacity="0.4"/>
  </g>
  <!-- The orbit: the back half behind the planet, the front half over it. -->
  <g transform="rotate(-22 232 276)">
    <path d="M42 276 A190 70 0 0 1 422 276" fill="none" stroke="#c9a96a" stroke-opacity="0.35" stroke-width="3"/>
  </g>
  <circle cx="232" cy="276" r="150" fill="url(#glow)"/>
  <circle cx="232" cy="276" r="92" fill="url(#planet)"/>
  <g clip-path="url(#disc)" fill="#4a3b21" fill-opacity="0.35">
    <circle cx="196" cy="240" r="16"/><circle cx="262" cy="300" r="22"/><circle cx="210" cy="320" r="9"/>
    <circle cx="272" cy="236" r="8"/><circle cx="170" cy="292" r="11"/><circle cx="300" cy="262" r="6"/>
  </g>
  <circle cx="232" cy="276" r="92" fill="none" stroke="#e8d09a" stroke-opacity="0.5" stroke-width="2"/>
  <g transform="rotate(-22 232 276)">
    <path d="M42 276 A190 70 0 0 0 422 276" fill="none" stroke="#c9a96a" stroke-opacity="0.75" stroke-width="3.5"/>
    <!-- A short bright trail behind the envelope, along the orbit. -->
    <path d="M300 340 A190 70 0 0 0 392 314" fill="none" stroke="url(#trail)" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- The envelope, riding the orbit at the upper right. -->
  <g transform="translate(404 242) rotate(-22)">
    <rect x="-46" y="-31" width="92" height="62" rx="7" fill="url(#paper)" stroke="#9a7c46" stroke-width="2.5"/>
    <path d="M-42 -26 L0 6 L42 -26" fill="none" stroke="#9a7c46" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M-42 27 L-12 -2 M42 27 L12 -2" fill="none" stroke="#9a7c46" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  </g>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#edge)" stroke-width="3"/>
</svg>
