<!doctype html>
<!-- The default share picture (Open Graph / Twitter / LinkedIn): 1200 x 630. Edit the words, then re-render. See ../README.md -->
<html lang="en"><head><meta charset="utf-8"><title>og-default</title>
<link rel="stylesheet" href="source.css">
<style>
  .canvas { width: 1200px; height: 630px; }
  .wm { position: absolute; left: 72px; top: 64px; font-size: 17px; }
  .copy { position: absolute; left: 72px; bottom: 84px; width: 640px; }
  .eyebrow-x { font-size: 15px; margin-bottom: 22px; }
  h1 { font-size: 74px; line-height: 1.04; }
  h1 em { white-space: nowrap; }
  .url { position: absolute; left: 72px; bottom: 36px; font-size: 18px; }
  .glow { right: -90px; top: 0; width: 700px; height: 700px; }
  .ring { right: 30px; top: 120px; width: 470px; height: auto; }
</style></head>
<body>
<div class="canvas">
  <div class="glow"></div>
  <img class="ring" src="../../design-system/assets/r7-orbit-mark-transparent.svg" alt="">
  <div class="wm"><img src="../../design-system/assets/r7-mark.svg" alt="">R7 Orbit</div>
  <div class="copy">
    <div class="eyebrow-x">Field notes on building with AI</div>
    <h1 class="display">News, builds and <em>the things in between.</em></h1>
  </div>
  <div class="url mono">example.com</div>
</div>
</body></html>
