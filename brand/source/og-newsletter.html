<!doctype html>
<!-- The newsletter's share picture (Buttondown's Share image, and link previews of /newsletter/): 1200 x 630.
     Same layout as og-default.html. Render: node scripts/render-brand.mjs og-newsletter (see ../README.md). -->
<html lang="en"><head><meta charset="utf-8"><title>og-newsletter</title>
<link rel="stylesheet" href="source.css">
<style>
  .canvas { width: 1200px; height: 630px; }
  .wm { position: absolute; left: 72px; top: 64px; font-size: 17px; }
  .copy { position: absolute; left: 72px; bottom: 84px; width: 660px; }
  .eyebrow-x { font-size: 15px; margin-bottom: 22px; }
  h1 { font-size: 80px; line-height: 1.04; }
  h1 em { white-space: nowrap; }
  .sub { margin: 24px 0 0; max-width: 34ch; font-size: 22px; line-height: 1.45; color: var(--text-2); }
  .url { position: absolute; left: 72px; bottom: 36px; font-size: 18px; }
  .glow { right: -90px; top: 0; width: 700px; height: 700px; }
  .ring { right: 30px; top: 120px; width: 470px; height: auto; }
</style></head>
<body>
<div class="canvas">
  <div class="glow"></div>
  <img class="ring" src="../../design-system/assets/r7-orbit-mark-transparent.svg" alt="">
  <div class="wm"><img src="../../design-system/assets/r7-mark.svg" alt="">R7 Orbit</div>
  <div class="copy">
    <div class="eyebrow-x">The weekly newsletter</div>
    <h1 class="display">The week in <em>one email.</em></h1>
    <p class="sub">AI news in short, new build logs, videos and projects, and what I'm building next.</p>
  </div>
  <div class="url mono">r7orbit.io/newsletter</div>
</div>
</body></html>
