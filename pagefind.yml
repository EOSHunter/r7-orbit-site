# Pagefind indexes the built site (dist/) after `astro build`; see the `build` script in package.json.
# Only the five content kinds and About are indexed. Archives, tags, author pages, /search/, 404 and /styleguide/ are left out.
site: dist
output_subdir: pagefind
glob: "{news,blog,vlogs,projects,repos}/*/index.html"
# Body text only: the header, footer and nav sit outside <main>, and the extras below repeat other pages' content.
root_selector: main
exclude_selectors:
  - "[data-pagefind-ignore]"
  - ".toc"
  - ".share-row"
  - ".series"
  - ".prev-next"
  - ".related"
  - ".subscribe-band"
  - ".breadcrumb"
force_language: en
